name: Build APK 2.3.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone 2.3.0 with LFS
        run: |
          git clone --depth 1 --branch v2.3.0 https://github.com/umr-xiaomai/kgka_Music_hl.git src
          cd src
          git lfs install
          git lfs pull
          ls -la android/app/src/main/res/drawable/ic_launcher_monochrome.png

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Patch abiFilters
        working-directory: src
        run: |
          grep -n abiFilters android/app/build.gradle.kts
          sed -i 's|abiFilters.add("arm64-v8a")|abiFilters.add("arm64-v8a"); abiFilters.add("armeabi-v7a")|g' android/app/build.gradle.kts
          grep -n abiFilters android/app/build.gradle.kts

      - name: Pub get
        working-directory: src
        run: flutter pub get

      - name: Build
        working-directory: src
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ka-music-2.3.0
          path: src/build/app/outputs/flutter-apk/*.apk
